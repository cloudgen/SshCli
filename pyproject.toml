[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SshCli"
version = "2.0.0"
description = "SshCli runs OpenSSH sshd and this login's SSH client from a text menu."
readme = "README.md"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
license = {text = "MIT"}
authors = [
    {name = "Wilgat Wong", email = "wilgat.wong@gmail.com"}
]
keywords = ["CLI", "TUI", "SSH", "sshd", "OpenSSH"]

dependencies = [
    "ChronicleLogger>=1.3.1",
]

[project.urls]
Homepage = "https://github.com/cloudgen/SshCli"
Repository = "https://github.com/cloudgen/SshCli"
Issues = "https://github.com/cloudgen/SshCli/issues"

[project.scripts]
sshd-cli = "SshCli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
